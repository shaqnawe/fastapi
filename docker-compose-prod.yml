services:
  api:
    container_name: fastapi-app
    build: .
    entrypoint: [ "sh", "./entrypoint.sh" ]
    depends_on:
      [postgres]
    ports:
      - 80:8000
    env_file:
      - .env
  postgres:
    container_name: fastapi-db
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: